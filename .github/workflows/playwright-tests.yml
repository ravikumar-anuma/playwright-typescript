name: Playwright Tests

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      testType:
        description: 'Test type (smoke, regression, or all). Use without @, e.g. "smoke"'
        required: true
        default: 'all'
      folder:
        description: 'Optional tests folder to run (e.g. src/tests). Leave empty to run all tests.'
        required: true
        default: 'all'
      singleTest:
        description: 'Optional single test file path to run (overrides folder).'
        required: true
        default: 'all'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pages: write
      id-token: write

    concurrency:
      group: playwright-tests-${{ github.ref }}
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        id: run-tests
        run: |
          set -e
          # Determine grep filter
          TEST_TYPE='${{ github.event.inputs.testType }}'
          FOLDER='${{ github.event.inputs.folder }}'
          SINGLE='${{ github.event.inputs.singleTest }}'

          GREP_OP=''
          if [ -n "$TEST_TYPE" ] && [ "$TEST_TYPE" != "all" ]; then
            # Playwright uses regex-style grep; we tag tests with @smoke etc. We pass grep for @tag
            GREP_OP="--grep=@$TEST_TYPE"
          fi

          # Determine path to run (single test overrides folder)
          PATH_OP=''
          if [ -n "$SINGLE" ]; then
            PATH_OP="$SINGLE"
          elif [ -n "$FOLDER" ]; then
            PATH_OP="$FOLDER"
          fi

          # Build command. Keep retries=1 and workers=4 (parallelism). Reporter generates HTML into playwright-report
          CMD="npx playwright test $PATH_OP $GREP_OP --retries=1 --workers=4 --reporter=html"
          echo "Running: $CMD"
          # Run tests but avoid failing the job here so we can always collect/upload report and publish it.
          set +e
          eval $CMD
          EXIT_CODE=$?
          set -e

          # Ensure report directory exists
          if [ -d playwright-report ]; then
            echo "Report generated at playwright-report"
          else
            echo "No playwright-report directory found (tests may have failed before report generation)"
          fi

          # preserve exit code for later step
          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT

      - name: Upload Playwright HTML report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

      - name: Publish Playwright HTML report to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: playwright-report
          publish_branch: gh-pages
          allow_empty_commit: true

      - name: Print Playwright report link
        if: always()
        run: |
          OWNER=${{ github.repository_owner }}
          REPO=${{ github.event.repository.name }}
          echo "Playwright HTML Report: https://$OWNER.github.io/$REPO/"

      - name: End job with test exit code
        if: always()
        run: |
          # Fail job if tests failed (exit code != 0)
          echo "Collected exit code: ${{ steps.run-tests.outputs.exit_code }}"
          if [ "${{ steps.run-tests.outputs.exit_code }}" != "0" ]; then
            echo "One or more tests failed. Exiting with non-zero status."
            exit ${{ steps.run-tests.outputs.exit_code }}
          fi